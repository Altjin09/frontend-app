<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Profile</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="profile-page">
    <div class="profile-card">
      <div class="profile-sidebar">
        <h2>My Profile</h2>
        <p>Profile мэдээллээ бөглөж, зургаа upload хийгээд хадгална.</p>

        <div class="image-box">
          <img id="previewImage" src="" alt="Profile Image" />
          <span id="imagePlaceholder">No image uploaded</span>
        </div>
      </div>

      <div class="profile-content">
        <h3 class="section-title">User Profile Form</h3>

        <div class="form-grid">
          <div class="field full-width">
            <label for="profileId">Profile ID</label>
            <input type="number" id="profileId" placeholder="Жишээ: 1" />
          </div>

          <div class="field">
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Full name" />
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="example@mail.com" />
          </div>

          <div class="field full-width">
            <label for="bio">Bio</label>
            <textarea id="bio" placeholder="Өөрийн тухай товч мэдээлэл..."></textarea>
          </div>

          <div class="field full-width">
            <label for="phone">Phone</label>
            <input type="text" id="phone" placeholder="99112233" />
          </div>

          <div class="field full-width">
            <label for="profileImage">Profile Image</label>
            <div class="upload-row">
              <input
                type="file"
                id="profileImage"
                accept="image/*"
                onchange="previewSelectedImage()"
              />
              <button class="success-btn" onclick="uploadImage()">Upload Image</button>
            </div>
          </div>
        </div>

        <div class="btn-row">
          <button class="primary-btn" onclick="createProfile()">Create Profile</button>
          <button class="secondary-btn" onclick="getProfile()">Get Profile</button>
          <button class="secondary-btn" onclick="updateProfile()">Update Profile</button>
          <button class="danger-btn" onclick="deleteProfile()">Delete Profile</button>
          <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <pre id="profileResult">Profile result энд харагдана...</pre>
      </div>
    </div>
  </div>

  <script>
    function previewSelectedImage() {
      const fileInput = document.getElementById("profileImage");
      const preview = document.getElementById("previewImage");
      const placeholder = document.getElementById("imagePlaceholder");

      if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function (e) {
          preview.src = e.target.result;
          preview.style.display = "block";
          if (placeholder) placeholder.style.display = "none";
        };
        reader.readAsDataURL(fileInput.files[0]);
      }
    }
  </script>

  <script src="app.js"></script>
</body>
</html>
